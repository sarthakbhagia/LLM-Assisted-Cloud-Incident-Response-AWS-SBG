name: Tests

on:
  push:
    branches: [main, swarali]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          # Handler modules read AWS config at import time; CI never calls AWS.
          AWS_REGION: ap-south-1
          AWS_DEFAULT_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: pytest tests -v --tb=short

      - name: Validate CloudFormation template
        run: |
          python - <<'EOF'
          import sys
          try:
              import yaml
          except ImportError:
              print("PyYAML not installed; skipping template check")
              sys.exit(0)
          yaml.parse(open("infra/template.yaml").read())
          print("infra/template.yaml: YAML syntax OK")
          EOF
