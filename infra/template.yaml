AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LLM-Assisted Cloud Incident Response - serverless pipeline.
  Phase 0: infra skeleton (data lake, incident table, IAM roles).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Architectures: [arm64]
    Tracing: Active

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment, used to suffix resource names.

  ServiceBUrl:
    Type: String
    Default: "http://placeholder-service-b"
    Description: HTTP endpoint used by Service A to call Service B.

  ServiceCUrl:
    Type: String
    Default: "http://placeholder-service-c"
    Description: HTTP endpoint used by Service B to call Service C.

  SlackWebhookUrlSsm:
    Type: String
    Default: "/llm-incident-response/slack-webhook-url"
    Description: >
      Name of the SSM SecureString parameter holding the Slack incoming
      webhook URL (Phase 5). If the parameter does not exist, Slack posting
      is skipped and the pipeline continues (logged as an error).

  ApprovalTokenSecretSsm:
    Type: String
    Default: "/llm-incident-response/approval-token-secret"
    Description: >
      Name of the SSM SecureString parameter holding the shared HMAC secret
      used to sign approval links (Phase 5). If the parameter does not exist,
      no approval links are included in Slack messages and approval requests
      are rejected (fail closed).

  ApprovalApiBaseUrl:
    Type: String
    Default: ""
    Description: >
      Base URL of the approval endpoint used in Slack approval links, e.g.
      https://<api-id>.execute-api.<region>.amazonaws.com/Prod/approval.
      Leave empty to omit approval links from Slack messages.

  BedrockModelId:
    Type: String
    Default: "apac.amazon.nova-pro-v1:0"
    Description: >
      Bedrock model ID to use for diagnosis. Must be available in the deployment region.
      Examples: apac.amazon.nova-pro-v1:0 (ap-south-1), anthropic.claude-3-5-sonnet-20240620-v1:0, meta.llama3-70b-instruct-v1:0

  BedrockFallbackModelId:
    Type: String
    Default: "meta.llama3-70b-instruct-v1:0"
    Description: >
      First fallback Bedrock model ID if primary model is unavailable.

  BedrockSecondFallbackModelId:
    Type: String
    Default: "mistral.mistral-large-2402-v1:0"
    Description: >
      Second fallback Bedrock model ID.

  BedrockNovaFallbackModelId:
    Type: String
    Default: "apac.amazon.nova-micro-v1:0"
    Description: >
      Nova Micro fallback Bedrock model ID.

  AllowedOrigin:
    Type: String
    Default: ""
    Description: >
      Frontend origin for CORS (e.g., https://d1234567890.cloudfront.net).
      Leave empty to allow all origins (development only). In production,
      must be set to the CloudFront distribution URL.

  DashboardApiKey:
    Type: String
    Default: ""
    Description: >
      API key for dashboard write endpoints (approve, reject, diagnose).
      Leave empty to disable API key authentication (development only).
      In production, must be set to a secure random string stored in SSM.

  DemoMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      If true, enables demo mode which allows CloudWatch alarm reset via
      SetAlarmState for demonstration purposes. When false (production),
      alarms recover naturally from metric changes.

  CreateConfigRule:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      If true, creates an AWS Config rule (s3-bucket-level-public-access-prohibited)
      and EventBridge rule for Config compliance changes. Default false because
      the account may already have a Config recorder/channel. When true, the
      Config rule monitors the DemoMisconfigBucket for public access block changes.

  VerificationWaitSeconds:
    Type: String
    Default: "15"
    Description: Initial wait time (seconds) before verification starts polling after remediation.

  VerificationPollSeconds:
    Type: String
    Default: "5"
    Description: Poll interval (seconds) between verification checks.

  VerificationMaxWaitSeconds:
    Type: String
    Default: "60"
    Description: Maximum total wait time (seconds) for verification polling.

  VerificationProbeCount:
    Type: String
    Default: "5"
    Description: Number of probe requests to Service A for active verification.

  ProbeLatencyThresholdMs:
    Type: String
    Default: "3000"
    Description: p95 latency threshold (ms) for active probe success.

  ResourceExhaustionThresholdMs:
    Type: String
    Default: "50000"
    Description: Duration threshold (ms) for resource exhaustion alarm.

  FaultInjectionToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Bearer token for authenticating fault injection endpoints on Services A, B, C.

Conditions:
  CreateConfigRuleCondition: !Equals [!Ref CreateConfigRule, "true"]
  IsDemoMode: !Equals [!Ref DemoMode, "true"]

Resources:

  # ---------------------------------------------------------------------------
  # Incident data lake (raw observability bundles + runbook docs)
  # ---------------------------------------------------------------------------
  IncidentDataLake:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "llm-incident-datalake-${AWS::AccountId}-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------------
  # Demo Misconfiguration Bucket (sacrificial, for fault injection only)
  # ---------------------------------------------------------------------------
  # This bucket is used exclusively for the misconfiguration fault class demo.
  # It starts with public access block DISABLED so the injector can disable it
  # (simulating a misconfiguration). Remediation re-enables it; verification checks it.
  # NO public bucket policy or ACL is ever applied - only the public access block
  # is toggled. The data-lake bucket (above) is NEVER touched by fault injection.
  DemoMisconfigBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "llm-incident-demo-misconfig-${AWS::AccountId}-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # ---------------------------------------------------------------------------
  # Optional: AWS Config rule for s3-bucket-level-public-access-prohibited
  # Only created when CreateConfigRule=true (account may already have a recorder)
  # ---------------------------------------------------------------------------
  MisconfigConfigRule:
    Type: AWS::Config::ConfigRule
    Condition: CreateConfigRuleCondition
    Properties:
      ConfigRuleName: "s3-bucket-level-public-access-prohibited"
      Description: "Checks that S3 buckets have public access block enabled"
      Scope:
        ComplianceResourceTypes:
          - "AWS::S3::Bucket"
      Source:
        Owner: "AWS"
        SourceIdentifier: "S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED"
      InputParameters: "{}"

  # EventBridge rule for Config compliance changes on the DemoMisconfigBucket
  # Triggers the collector when the bucket goes NON_COMPLIANT
  ConfigComplianceEventRule:
    Type: AWS::Events::Rule
    Condition: CreateConfigRuleCondition
    Properties:
      Name: !Sub "incident-config-compliance-${Environment}"
      Description: Routes Config compliance changes for DemoMisconfigBucket to collector
      EventPattern:
        source:
          - "aws.config"
        detail-type:
          - "Config Rules Compliance Change"
        detail:
          messageType:
            - "ComplianceChangeNotification"
          newEvaluationResult:
            complianceType:
              - "NON_COMPLIANT"
          resourceId:
            - !Ref DemoMisconfigBucket
          resourceType:
            - "AWS::S3::Bucket"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: ConfigComplianceCollectorTarget
          InputTransformer:
            InputPathsMap:
              configRuleName: "$.detail.newEvaluationResult.configRuleInvokedTime"
              resourceId: "$.detail.resourceId"
              resourceType: "$.detail.resourceType"
              complianceType: "$.detail.newEvaluationResult.complianceType"
            InputTemplate: |
              {
                "source": "aws_config",
                "fault_class": "misconfiguration",
                "config_rule": "s3-bucket-level-public-access-prohibited",
                "resource_id": <resourceId>,
                "resource_type": <resourceType>,
                "compliance_type": <complianceType>
              }

  ConfigComplianceEventPermission:
    Type: AWS::Lambda::Permission
    Condition: CreateConfigRuleCondition
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ConfigComplianceEventRule.Arn

  # ---------------------------------------------------------------------------
  # Structured incident records
  # ---------------------------------------------------------------------------
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "incidents-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------------
  # IAM role: collector + diagnosis Lambdas.
  # Read-only observability access + Bedrock invoke + S3/DynamoDB write.
  # ---------------------------------------------------------------------------
  CollectorDiagnosisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-collector-diagnosis-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: observability-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:DescribeLogStreams
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                Resource: '*'
              - Effect: Allow
                Action:
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                  - xray:GetServiceGraph
                  - xray:GetTraceGraph
                Resource: '*'
              - Effect: Allow
                Action:
                  - config:GetComplianceDetailsByConfigRule
                  - config:GetResourceConfigHistory
                  - config:DescribeComplianceByConfigRule
                Resource: '*'
              - Effect: Allow
                Action:
                  - guardduty:GetFindings
                  - guardduty:ListFindings
                  - guardduty:ListDetectors
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:ListFunctions
                Resource: '*'
        - PolicyName: datalake-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/runbooks/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt IncidentDataLake.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Direct foundation-model ARNs (us/eu/ap regional direct invocation)
              # Nova Pro/Micro are region-specific; grant all APAC regions where apac profile routes
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - "arn:aws:bedrock:ap-south-1::foundation-model/amazon.nova-pro-v1:0"
                  - "arn:aws:bedrock:ap-southeast-1::foundation-model/amazon.nova-pro-v1:0"
                  - "arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.nova-pro-v1:0"
                  - "arn:aws:bedrock:ap-northeast-1::foundation-model/amazon.nova-pro-v1:0"
                  - "arn:aws:bedrock:ap-northeast-2::foundation-model/amazon.nova-pro-v1:0"
                  - "arn:aws:bedrock:ap-northeast-3::foundation-model/amazon.nova-pro-v1:0"
                  - "arn:aws:bedrock:ap-south-1::foundation-model/amazon.nova-micro-v1:0"
                  - "arn:aws:bedrock:ap-southeast-1::foundation-model/amazon.nova-micro-v1:0"
                  - "arn:aws:bedrock:ap-southeast-2::foundation-model/amazon.nova-micro-v1:0"
                  - "arn:aws:bedrock:ap-northeast-1::foundation-model/amazon.nova-micro-v1:0"
                  - "arn:aws:bedrock:ap-northeast-2::foundation-model/amazon.nova-micro-v1:0"
                  - "arn:aws:bedrock:ap-northeast-3::foundation-model/amazon.nova-micro-v1:0"
                  - "arn:aws:bedrock:*::foundation-model/meta.llama3-70b-instruct-v1:0"
                  - "arn:aws:bedrock:*::foundation-model/mistral.mistral-large-2402-v1:0"
              # Cross-region inference profiles (apac.* prefix used by the diagnosis code)
              # These have a different ARN shape: bedrock:<region>:<account>:inference-profile/<id>
              # The apac profiles can route to any APAC region; grant all possible target regions
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:aws:bedrock:ap-south-1:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-southeast-1:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-southeast-2:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-1:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-2:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-3:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-south-1:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-southeast-1:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-southeast-2:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-1:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-2:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-3:${AWS::AccountId}:inference-profile/apac.amazon.nova-micro-v1:0"
                  - !Sub "arn:aws:bedrock:ap-south-1:${AWS::AccountId}:inference-profile/apac.meta.llama3-70b-instruct-v1:0"
                  - !Sub "arn:aws:bedrock:ap-southeast-1:${AWS::AccountId}:inference-profile/apac.meta.llama3-70b-instruct-v1:0"
                  - !Sub "arn:aws:bedrock:ap-southeast-2:${AWS::AccountId}:inference-profile/apac.meta.llama3-70b-instruct-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-1:${AWS::AccountId}:inference-profile/apac.meta.llama3-70b-instruct-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-2:${AWS::AccountId}:inference-profile/apac.meta.llama3-70b-instruct-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-3:${AWS::AccountId}:inference-profile/apac.meta.llama3-70b-instruct-v1:0"
                  - !Sub "arn:aws:bedrock:ap-south-1:${AWS::AccountId}:inference-profile/apac.mistral.mistral-large-2402-v1:0"
                  - !Sub "arn:aws:bedrock:ap-southeast-1:${AWS::AccountId}:inference-profile/apac.mistral.mistral-large-2402-v1:0"
                  - !Sub "arn:aws:bedrock:ap-southeast-2:${AWS::AccountId}:inference-profile/apac.mistral.mistral-large-2402-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-1:${AWS::AccountId}:inference-profile/apac.mistral.mistral-large-2402-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-2:${AWS::AccountId}:inference-profile/apac.mistral.mistral-large-2402-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-3:${AWS::AccountId}:inference-profile/apac.mistral.mistral-large-2402-v1:0"
        - PolicyName: invoke-downstream-lambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  # Stack-scoped wildcard: avoids circular dependency (functions reference this role)
                  # and correctly matches SAM-generated names like {StackName}-{LogicalId}-{Random}
                  # with no ${Environment} segment. The prefix is intentionally not including
                  # the environment so it works for any stack deployed from this template.
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-DiagnosisFunction*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-NotifyFunction*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-RemediationFunction*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ApprovalFunction*"


  # ---------------------------------------------------------------------------
  # IAM role: remediation Lambda.
  # Tightly scoped to ONLY the specific actions in actions.py. No wildcards.
  # ---------------------------------------------------------------------------
  RemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-remediation-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: remediation-read-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
              - Effect: Allow
                Action:
                  - s3:PutBucketPublicAccessBlock
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - cloudwatch:DescribeAlarms
                  - config:GetComplianceDetailsByConfigRule
                  - config:StartConfigRulesEvaluation
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetPublicAccessBlock
                Resource: '*'
        - PolicyName: remediation-lambda-actions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # scale_up - Lambda reserved concurrency
              - Effect: Allow
                Action:
                  - lambda:GetFunctionConcurrency
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:ListFunctions
                Resource: '*'
              # restart_service / restart_downstream_service - bump env var
              - Effect: Allow
                Action:
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionConfiguration
                  - lambda:ListFunctions
                Resource: '*'

        - PolicyName: remediation-iam-actions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # tighten_iam_policy
              - Effect: Allow
                Action:
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListRoles
                Resource: '*'
        - PolicyName: invoke-verification-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-VerificationFunction*"
        # Demo mode: allow CloudWatch alarm reset via SetAlarmState
        # This is needed for demo scenarios where alarms are triggered via SetAlarmState
        # rather than real metric breaches. In production, alarms recover naturally.
        # The code checks DEMO_MODE env var before calling SetAlarmState.
        - Fn::If:
            - IsDemoMode
            - PolicyName: demo-cloudwatch-alarm-reset
              PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Action:
                      - cloudwatch:SetAlarmState
                    Resource: '*'
            - Ref: "AWS::NoValue"

  # ===========================================================================
  # PHASE 1 - DEMO APPLICATION
  # Service A -> Service B -> Service C
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # IAM role for demo application
  # ---------------------------------------------------------------------------
  DemoAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-demo-app-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: xray-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  # ---------------------------------------------------------------------------
  # Service C
  # ---------------------------------------------------------------------------
  ServiceCFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/service_c/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Environment:
        Variables:
          FAULT_INJECTION_TOKEN: !Ref FaultInjectionToken
      Events:
        Api:
          Type: Api
          Properties:
            Path: /service-c
            Method: get
        FaultApi:
          Type: Api
          Properties:
            Path: /service-c/fault
            Method: post
        FaultApiOptions:
          Type: Api
          Properties:
            Path: /service-c/fault
            Method: options
        FaultApiGet:
          Type: Api
          Properties:
            Path: /service-c/fault
            Method: get

  # ---------------------------------------------------------------------------
  # Service B
  # ---------------------------------------------------------------------------
  ServiceBFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/service_b/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Environment:
        Variables:
          SERVICE_C_URL: !Ref ServiceCUrl
          FAULT_INJECTION_TOKEN: !Ref FaultInjectionToken
      Events:
        Api:
          Type: Api
          Properties:
            Path: /service-b
            Method: get
        FaultApi:
          Type: Api
          Properties:
            Path: /service-b/fault
            Method: post
        FaultApiOptions:
          Type: Api
          Properties:
            Path: /service-b/fault
            Method: options
        FaultApiGet:
          Type: Api
          Properties:
            Path: /service-b/fault
            Method: get

  # ---------------------------------------------------------------------------
  # Service A
  # ---------------------------------------------------------------------------
  ServiceAFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/service_a/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Environment:
        Variables:
          SERVICE_B_URL: !Ref ServiceBUrl
          FAULT_INJECTION_TOKEN: !Ref FaultInjectionToken
      Events:
        Api:
          Type: Api
          Properties:
            Path: /start
            Method: get
        FaultApi:
          Type: Api
          Properties:
            Path: /start/fault
            Method: post
        FaultApiOptions:
          Type: Api
          Properties:
            Path: /start/fault
            Method: options
        FaultApiGet:
          Type: Api
          Properties:
            Path: /start/fault
            Method: get
  # =========================================================================== 
  # PHASE 2 - DETECTION
  # Collector Lambda receives detection events from EventBridge.
  # Full evidence collection will be implemented in Phase 3.
  # ===========================================================================
    # ---------------------------------------------------------------------------
  # PHASE 2 - Resource Exhaustion Detection
  # Lambda execution taking too long can indicate resource pressure.
  # ---------------------------------------------------------------------------

  ServiceAResourceExhaustionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-service-a-resource-exhaustion-${Environment}"
      AlarmDescription: Detects unusually long Service A Lambda executions
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ServiceAFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref ResourceExhaustionThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

   # ---------------------------------------------------------------------------
  # PHASE 2 - Service Error Detection
  # Repeated Lambda errors are an incident detection signal.
  # ---------------------------------------------------------------------------

  ServiceAErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-service-a-errors-${Environment}"
      AlarmDescription: Detects repeated errors from Service A
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ServiceAFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/collector/
      Handler: collector_lambda.lambda_handler
      Role: !GetAtt CollectorDiagnosisRole.Arn
      Description: Receives incident detection events, collects observability evidence, writes to S3+DynamoDB, invokes diagnosis
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          DIAGNOSIS_FUNCTION_NAME: !Ref DiagnosisFunction

  DiagnosisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/diagnosis/
      Handler: diagnosis_lambda.lambda_handler
      Role: !GetAtt CollectorDiagnosisRole.Arn
      Description: Receives incident evidence, loads runbook context, calls Bedrock for LLM diagnosis
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelId
          BEDROCK_SECOND_FALLBACK_MODEL_ID: !Ref BedrockSecondFallbackModelId
          BEDROCK_NOVA_FALLBACK_MODEL_ID: !Ref BedrockNovaFallbackModelId
          NOTIFY_FUNCTION_NAME: !Ref NotifyFunction

  # ---------------------------------------------------------------------------
  # PHASE 2 - EventBridge routing for CloudWatch alarms
  # ---------------------------------------------------------------------------
  CloudWatchIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-cloudwatch-detection-${Environment}"
      Description: Routes resource exhaustion alarm events to the collector
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - "CloudWatch Alarm State Change"
        detail:
          state:
            value:
              - ALARM
          alarmName:
            - !Sub "incident-service-a-resource-exhaustion-${Environment}"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: CollectorTarget
          InputTransformer:
            InputPathsMap:
              alarm_name: "$.detail.alarmName"
              state: "$.detail.state.value"
              reason: "$.detail.state.reason"
            InputTemplate: |
              {
                "source": "cloudwatch",
                "fault_class": "resource_exhaustion",
                "alarm_name": <alarm_name>,
                "state": <state>,
                "reason": <reason>
              }

  CloudWatchIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CloudWatchIncidentEventRule.Arn
  # ===========================================================================
  # PHASE 2 - GUARDDUTY DETECTION (AWS Config disabled - only one recorder/channel per account)
  # ===========================================================================

  GuardDutyIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-guardduty-detection-${Environment}"
      Description: Routes relevant GuardDuty findings to the collector
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - "GuardDuty Finding"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: GuardDutyCollectorTarget

  GuardDutyIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GuardDutyIncidentEventRule.Arn

  ServiceCHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-service-c-latency-${Environment}"
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ServiceCFunction
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ServiceCascadeCompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub "incident-service-cascade-${Environment}"
      AlarmRule: !Sub "ALARM(\"incident-service-a-errors-${Environment}\") AND ALARM(\"incident-service-c-latency-${Environment}\")"
    DependsOn:
      - ServiceAErrorAlarm
      - ServiceCHighLatencyAlarm

  CascadeIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-cascade-detection-${Environment}"
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - "CloudWatch Alarm State Change"
        detail:
          state:
            value:
              - ALARM
          alarmName:
            - !Sub "incident-service-cascade-${Environment}"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: CascadeCollectorTarget
          InputTransformer:
            InputPathsMap:
              alarm_name: "$.detail.alarmName"
              state: "$.detail.state.value"
            InputTemplate: |
              {
                "source": "cloudwatch",
                "fault_class": "service_cascade",
                "alarm_name": <alarm_name>,
                "state": <state>
              }

  CascadeIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CascadeIncidentEventRule.Arn

  # ===========================================================================
  # PHASE 6 - REMEDIATION
  # Executes the approved action and triggers closed-loop verification.
  # ===========================================================================

  RemediationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/remediation/
      Handler: remediation_lambda.lambda_handler
      Role: !GetAtt RemediationRole.Arn
      Description: Executes the approved remediation action then async-invokes the verification Lambda
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          VERIFICATION_FUNCTION_NAME: !Ref VerificationFunction
          DEMO_MODE: !Ref DemoMode
          RESOURCE_EXHAUSTION_DURATION_THRESHOLD_MS: !Ref ResourceExhaustionThresholdMs

  # ===========================================================================
  # PHASE 6.5 - CLOSED-LOOP VERIFICATION (core research novelty)
  # Waits 2 min post-remediation, re-checks the original detection signal,
  # writes resolved/not_resolved/inconclusive to IncidentRecord.verification.
  # ===========================================================================

  VerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/verification/
      Handler: verification_lambda.lambda_handler
      Role: !GetAtt RemediationRole.Arn
      Description: Re-checks the original incident signal post-remediation and writes verification outcome to DynamoDB
      Timeout: 600
      MemorySize: 256
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          DEMO_MODE: !Ref DemoMode
          VERIFICATION_WAIT_SECONDS: !Ref VerificationWaitSeconds
          VERIFICATION_POLL_SECONDS: !Ref VerificationPollSeconds
          VERIFICATION_MAX_WAIT_SECONDS: !Ref VerificationMaxWaitSeconds
          VERIFICATION_PROBE_COUNT: !Ref VerificationProbeCount
          PROBE_LATENCY_THRESHOLD_MS: !Ref ProbeLatencyThresholdMs
          # SERVICE_A_URL is intentionally omitted to avoid circular dependency with ServerlessRestApi.
          # The verification lambda will use the function URL discovery fallback if not set.

  IncidentDataLakeConfigPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IncidentDataLake
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSConfigBucketPermissionsCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt IncidentDataLake.Arn
          - Sid: AWSConfigBucketDelivery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${IncidentDataLake.Arn}/AWSLogs/${AWS::AccountId}/Config/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
  # ===========================================================================
  # PHASE 5 - REPORTING + APPROVAL
  # Notify Lambda posts the diagnosis to Slack via incoming webhook;
  # Approval endpoint flips remediation.status and triggers remediation.
  # ===========================================================================

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/reporting/
      Handler: notify_lambda.lambda_handler
      Role: !GetAtt ReportingApprovalRole.Arn
      Description: Formats the diagnosis into a Slack message and posts it via incoming webhook
      Timeout: 30
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          SLACK_WEBHOOK_URL_SSM: !Ref SlackWebhookUrlSsm
          APPROVAL_TOKEN_SECRET_SSM: !Ref ApprovalTokenSecretSsm
          APPROVAL_API_BASE: !Ref ApprovalApiBaseUrl

  ApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/approval/
      Handler: approval_handler.lambda_handler
      Role: !GetAtt ReportingApprovalRole.Arn
      Description: Approve/reject endpoint; updates incident status and invokes remediation when approved
      Timeout: 30
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          APPROVAL_TOKEN_SECRET_SSM: !Ref ApprovalTokenSecretSsm
          REMEDIATION_FUNCTION_NAME: !Ref RemediationFunction
      Events:
        ApprovalGet:
          Type: Api
          Properties:
            Path: /approval
            Method: get
        ApprovalPost:
          Type: Api
          Properties:
            Path: /approval
            Method: post

  # Shared role for the two Phase 5 Lambdas: read incidents + raw data,
  # decrypt the two SSM parameters, and invoke the remediation Lambda.
  ReportingApprovalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-reporting-approval-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: incident-record-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: raw-evidence-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
        - PolicyName: ssm-secure-parameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackWebhookUrlSsm}"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApprovalTokenSecretSsm}"
        - PolicyName: invoke-remediation-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*RemediationFunction*"

  ApprovalFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApprovalFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  # ===========================================================================
  # PHASE 8 - DASHBOARD API (read-only visualization layer)
  # Guardrail: this role MUST NOT have any write permissions.
  # See PROJECT_SPEC.md Guardrails: "The Phase 8 dashboard Lambda/IAM role must
  # be strictly read-only (DynamoDB GetItem/Query and S3 GetObject only)."
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # IAM role: Dashboard API Lambda.
  # Read-only on incidents table and data lake. No write actions of any kind.
  # AWS calls: DynamoDB Scan/GetItem, S3 GetObject/ListObjectsV2/HeadBucket
  # ---------------------------------------------------------------------------
  DashboardApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-dashboard-api-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: incidents-table-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt IncidentsTable.Arn
                # Explicit deny of write actions for auditable guardrail
              - Effect: Deny
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: datalake-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt IncidentDataLake.Arn
                  - !Sub "${IncidentDataLake.Arn}/incidents/*"
                  - !Sub "${IncidentDataLake.Arn}/runbooks/*"
                  - !Sub "${IncidentDataLake.Arn}/evaluation/*"
              - Effect: Deny
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:PutObjectAcl
                Resource:
                  - !GetAtt IncidentDataLake.Arn
                  - !Sub "${IncidentDataLake.Arn}/*"

  # ---------------------------------------------------------------------------
  # Dashboard API Lambda — six read-only routes on the existing API Gateway
  # ---------------------------------------------------------------------------
  DashboardApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dashboard_api/
      Handler: dashboard_api_lambda.lambda_handler
      Role: !GetAtt DashboardApiRole.Arn
      Description: >-
        Phase 8 read-only dashboard API. Serves incident records, evidence
        bundles, Phase 7 analytics, and runbook content. No write paths.
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        GetIncidents:
          Type: Api
          Properties:
            Path: /api/incidents
            Method: get
        GetIncidentsOptions:
          Type: Api
          Properties:
            Path: /api/incidents
            Method: options
        GetIncidentById:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}
            Method: get
        GetIncidentByIdOptions:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}
            Method: options
        GetEvidence:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/evidence
            Method: get
        GetEvidenceOptions:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/evidence
            Method: options
        GetAnalytics:
          Type: Api
          Properties:
            Path: /api/analytics
            Method: get
        GetAnalyticsOptions:
          Type: Api
          Properties:
            Path: /api/analytics
            Method: options
        GetRunbooks:
          Type: Api
          Properties:
            Path: /api/runbooks
            Method: get
        GetRunbooksOptions:
          Type: Api
          Properties:
            Path: /api/runbooks
            Method: options
        GetRunbookByFaultClass:
          Type: Api
          Properties:
            Path: /api/runbooks/{fault_class}
            Method: get
        GetRunbookByFaultClassOptions:
          Type: Api
          Properties:
            Path: /api/runbooks/{fault_class}
            Method: options
        GetHealth:
          Type: Api
          Properties:
            Path: /api/health
            Method: get
        GetHealthOptions:
          Type: Api
          Properties:
            Path: /api/health
            Method: options

# DashboardApiFunctionApiPermission:
#     Type: AWS::Lambda::Permission
#     Properties:
#       FunctionName: !Ref DashboardApiFunction
#       Action: lambda:InvokeFunction
#       Principal: apigateway.amazonaws.com

  DashboardApiFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DashboardApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  # ===========================================================================
  # DASHBOARD ACTIONS FUNCTION
  # Write-path and action routes (approve, reject, diagnose, trace, services).
  # Kept separate from DashboardApiFunction to preserve its strict read-only
  # IAM guardrail.  This function has narrow UpdateItem + Lambda:Invoke + CloudWatch:GetMetricStatistics + Lambda:ListFunctions perms.
  # AWS calls: DynamoDB GetItem/UpdateItem/Scan, S3 GetObject/ListObjectsV2, Lambda InvokeFunction/ListFunctions, CloudWatch GetMetricStatistics
  # ===========================================================================

  DashboardActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-dashboard-actions-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: incidents-table-actions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read: look up incident before approve/reject/diagnose/trace
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt IncidentsTable.Arn
              # Write: approve and reject update remediation.status only (conditional)
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
              # Scan for active incidents in /api/services
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: datalake-trace-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt IncidentDataLake.Arn
                  - !Sub "${IncidentDataLake.Arn}/incidents/*"
        - PolicyName: invoke-diagnosis-function
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt DiagnosisFunction.Arn
        - PolicyName: invoke-remediation-function
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt RemediationFunction.Arn
        - PolicyName: cloudwatch-metrics-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                Resource: "*"
        - PolicyName: lambda-list-functions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:ListFunctions
                Resource: "*"

  DashboardActionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dashboard_api/
      Handler: dashboard_actions_lambda.lambda_handler
      Role: !GetAtt DashboardActionsRole.Arn
      Description: >-
        Dashboard write-path actions: approve, reject, diagnose, trace, services.
        Separate from DashboardApiFunction to preserve its read-only IAM guardrail.
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          DIAGNOSIS_FUNCTION_NAME: !Ref DiagnosisFunction
          REMEDIATION_FUNCTION_NAME: !Ref RemediationFunction
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          DASHBOARD_API_KEY: !Ref DashboardApiKey
      Events:
        ApproveIncident:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/approve
            Method: post
        ApproveIncidentOptions:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/approve
            Method: options
        RejectIncident:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/reject
            Method: post
        RejectIncidentOptions:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/reject
            Method: options
        DiagnoseIncident:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/diagnose
            Method: post
        DiagnoseIncidentOptions:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/diagnose
            Method: options
        GetTrace:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/trace
            Method: get
        GetTraceOptions:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/trace
            Method: options
        GetTraceArtifact:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/trace/artifact
            Method: get
        GetTraceArtifactOptions:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/trace/artifact
            Method: options
        GetServices:
          Type: Api
          Properties:
            Path: /api/services
            Method: get
        GetServicesOptions:
          Type: Api
          Properties:
            Path: /api/services
            Method: options

  DashboardActionsFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DashboardActionsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com


# =============================================================================

Outputs:

  IncidentDataLakeName:
    Description: Name of the S3 data lake bucket
    Value: !Ref IncidentDataLake
    Export:
      Name: !Sub "${AWS::StackName}-IncidentDataLakeName"

  DemoMisconfigBucketName:
    Description: Name of the sacrificial S3 bucket for misconfiguration fault injection demos
    Value: !Ref DemoMisconfigBucket
    Export:
      Name: !Sub "${AWS::StackName}-DemoMisconfigBucketName"

  IncidentsTableName:
    Description: Name of the DynamoDB incidents table
    Value: !Ref IncidentsTable
    Export:
      Name: !Sub "${AWS::StackName}-IncidentsTableName"

  IncidentsTableArn:
    Description: ARN of the DynamoDB incidents table
    Value: !GetAtt IncidentsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-IncidentsTableArn"

  ApprovalFunctionArn:
    Description: ARN of the Phase 5 approval endpoint Lambda
    Value: !GetAtt ApprovalFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ApprovalFunctionArn"

  RemediationRoleArn:
    Description: ARN of the remediation Lambda role
    Value: !GetAtt RemediationRole.Arn

  DemoAppRoleArn:
    Description: ARN of the Phase 1 demo application role
    Value: !GetAtt DemoAppRole.Arn

  CollectorFunctionArn:
    Description: ARN of the Phase 3 collector Lambda
    Value: !GetAtt CollectorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CollectorFunctionArn"

  DiagnosisFunctionArn:
    Description: ARN of the Phase 4 diagnosis Lambda (stub until Phase 4)
    Value: !GetAtt DiagnosisFunction.Arn

  NotifyFunctionArn:
    Description: ARN of the Phase 5 notify (Slack reporting) Lambda
    Value: !GetAtt NotifyFunction.Arn

  RemediationFunctionArn:
    Description: ARN of the Phase 6 remediation Lambda
    Value: !GetAtt RemediationFunction.Arn

  VerificationFunctionArn:
    Description: ARN of the Phase 6.5 verification Lambda
    Value: !GetAtt VerificationFunction.Arn

  ApprovalUrl:
    Description: Phase 5 approval endpoint (append ?incident_id=...&action=approve&token=...)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/approval"

  ServiceAUrl:
    Description: Phase 1 entry point
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/start"

  ServiceBUrl:
    Description: Service B endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/service-b"

  ServiceCUrl:
    Description: Service C endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/service-c"

  ServiceAFunctionArn:
    Description: ARN of the Service A Lambda (retained for cross-stack compatibility with demo-control stack)
    Value: !GetAtt ServiceAFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ServiceAFunctionArn"

  ServiceCFunctionArn:
    Description: ARN of the Service C Lambda (retained for cross-stack compatibility)
    Value: !GetAtt ServiceCFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ServiceCFunctionArn"

  DashboardApiFunctionArn:
    Description: ARN of the Phase 8 read-only dashboard API Lambda
    Value: !GetAtt DashboardApiFunction.Arn

  DashboardApiUrl:
    Description: >-
      Phase 8 dashboard API base URL. Set VITE_API_BASE_URL to this value.
      The frontend appends /api/incidents, /api/analytics, /api/runbooks etc.
      This URL intentionally ends at /Prod (no trailing /api).
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  DashboardApiRoleArn:
    Description: ARN of the Phase 8 read-only dashboard IAM role (no write permissions)
    Value: !GetAtt DashboardApiRole.Arn

  DashboardActionsFunctionArn:
    Description: ARN of the dashboard actions Lambda (approve, reject, diagnose, trace, services)
    Value: !GetAtt DashboardActionsFunction.Arn

  DashboardActionsRoleArn:
    Description: ARN of the dashboard actions IAM role (narrowly-scoped write + invoke)
    Value: !GetAtt DashboardActionsRole.Arn
