AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LLM-Assisted Cloud Incident Response - serverless pipeline.
  Phase 0: infra skeleton (data lake, incident table, IAM roles).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Architectures: [arm64]
    Tracing: Active

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment, used to suffix resource names.

  ServiceBUrl:
    Type: String
    Default: "http://placeholder-service-b"
    Description: HTTP endpoint used by Service A to call Service B.

  ServiceCUrl:
    Type: String
    Default: "http://placeholder-service-c"
    Description: HTTP endpoint used by Service B to call Service C.

  SlackWebhookUrlSsm:
    Type: String
    Default: "/llm-incident-response/slack-webhook-url"
    Description: >
      Name of the SSM SecureString parameter holding the Slack incoming
      webhook URL (Phase 5). If the parameter does not exist, Slack posting
      is skipped and the pipeline continues (logged as an error).

  ApprovalTokenSecretSsm:
    Type: String
    Default: "/llm-incident-response/approval-token-secret"
    Description: >
      Name of the SSM SecureString parameter holding the shared HMAC secret
      used to sign approval links (Phase 5). If the parameter does not exist,
      no approval links are included in Slack messages and approval requests
      are rejected (fail closed).

  ApprovalApiBaseUrl:
    Type: String
    Default: ""
    Description: >
      Base URL of the approval endpoint used in Slack approval links, e.g.
      https://<api-id>.execute-api.<region>.amazonaws.com/Prod/approval.
      Leave empty to omit approval links from Slack messages.

Resources:

  # ---------------------------------------------------------------------------
  # Incident data lake (raw observability bundles + runbook docs)
  # ---------------------------------------------------------------------------
  IncidentDataLake:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "llm-incident-datalake-${AWS::AccountId}-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------------
  # Structured incident records
  # ---------------------------------------------------------------------------
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "incidents-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------------
  # IAM role: collector + diagnosis Lambdas.
  # Read-only observability access + Bedrock invoke + S3/DynamoDB write.
  # ---------------------------------------------------------------------------
  CollectorDiagnosisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-collector-diagnosis-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: observability-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:DescribeLogStreams
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'
              - Effect: Allow
                Action:
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                  - xray:GetServiceGraph
                  - xray:GetTraceGraph
                Resource: '*'
              - Effect: Allow
                Action:
                  - config:GetComplianceDetailsByConfigRule
                  - config:GetResourceConfigHistory
                  - config:DescribeComplianceByConfigRule
                Resource: '*'
              - Effect: Allow
                Action:
                  - guardduty:GetFindings
                  - guardduty:ListFindings
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListServices
                  - ecs:ListTasks
                Resource: '*'
        - PolicyName: datalake-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/runbooks/*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource: '*'
        - PolicyName: invoke-downstream-lambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*DiagnosisFunction*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*NotifyFunction*"


  # ---------------------------------------------------------------------------
  # IAM role: remediation Lambda.
  # Tightly scoped to ONLY the specific actions in actions.py. No wildcards.
  # ---------------------------------------------------------------------------
  RemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-remediation-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: remediation-read-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
        - PolicyName: remediation-actions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # scale_up - Application Auto Scaling + ECS update service
              - Effect: Allow
                Action:
                  - application-autoscaling:RegisterScalableTarget
                  - application-autoscaling:PutScalingPolicy
                  - application-autoscaling:DeregisterScalableTarget
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: '*'

              # restart_service / restart_downstream_service
              - Effect: Allow
                Action:
                  - ecs:StopTask
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                Resource: '*'

              # lock_s3_bucket
              - Effect: Allow
                Action:
                  - s3:PutPublicAccessBlock
                Resource: '*'

              # tighten_iam_policy
              - Effect: Allow
                Action:
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                Resource: '*'

  # ===========================================================================
  # PHASE 1 - DEMO APPLICATION
  # Service A -> Service B -> Service C
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # IAM role for demo application
  # ---------------------------------------------------------------------------
  DemoAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-demo-app-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: xray-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  # ---------------------------------------------------------------------------
  # Service C
  # ---------------------------------------------------------------------------
  ServiceCFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/service_c/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /service-c
            Method: get

  # ---------------------------------------------------------------------------
  # Service B
  # ---------------------------------------------------------------------------
  ServiceBFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/service_b/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Environment:
        Variables:
          SERVICE_C_URL: !Ref ServiceCUrl
      Events:
        Api:
          Type: Api
          Properties:
            Path: /service-b
            Method: get

  # ---------------------------------------------------------------------------
  # Service A
  # ---------------------------------------------------------------------------
  ServiceAFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/service_a/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Environment:
        Variables:
          SERVICE_B_URL: !Ref ServiceBUrl
      Events:
        Api:
          Type: Api
          Properties:
            Path: /start
            Method: get
  # =========================================================================== 
  # PHASE 2 - DETECTION
  # Collector Lambda receives detection events from EventBridge.
  # Full evidence collection will be implemented in Phase 3.
  # ===========================================================================
    # ---------------------------------------------------------------------------
  # PHASE 2 - Resource Exhaustion Detection
  # Lambda execution taking too long can indicate resource pressure.
  # ---------------------------------------------------------------------------

  ServiceAResourceExhaustionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-service-a-resource-exhaustion-${Environment}"
      AlarmDescription: Detects unusually long Service A Lambda executions
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ServiceAFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 50000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

   # ---------------------------------------------------------------------------
  # PHASE 2 - Service Error Detection
  # Repeated Lambda errors are an incident detection signal.
  # ---------------------------------------------------------------------------

  ServiceAErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-service-a-errors-${Environment}"
      AlarmDescription: Detects repeated errors from Service A
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ServiceAFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/collector/
      Handler: app.lambda_handler
      Role: !GetAtt CollectorDiagnosisRole.Arn
      Description: Receives incident detection events, collects observability evidence, writes to S3+DynamoDB, invokes diagnosis
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          DIAGNOSIS_FUNCTION_NAME: !Ref DiagnosisFunction

  DiagnosisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/diagnosis/
      Handler: app.lambda_handler
      Role: !GetAtt CollectorDiagnosisRole.Arn
      Description: Receives incident evidence, loads runbook context, calls Bedrock for LLM diagnosis
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          BEDROCK_MODEL_ID: "us.anthropic.claude-3-5-sonnet-20241022-v2:0"
          NOTIFY_FUNCTION_NAME: !Ref NotifyFunction

  # ---------------------------------------------------------------------------
  # PHASE 2 - EventBridge routing for CloudWatch alarms
  # ---------------------------------------------------------------------------
  CloudWatchIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-cloudwatch-detection-${Environment}"
      Description: Routes resource exhaustion alarm events to the collector
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - "CloudWatch Alarm State Change"
        detail:
          state:
            value:
              - ALARM
          alarmName:
            - !Sub "incident-service-a-resource-exhaustion-${Environment}"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: CollectorTarget
          InputTransformer:
            InputPathsMap:
              alarm_name: "$.detail.alarmName"
              state: "$.detail.state.value"
              reason: "$.detail.state.reason"
            InputTemplate: |
              {
                "source": "cloudwatch",
                "fault_class": "resource_exhaustion",
                "alarm_name": <alarm_name>,
                "state": <state>,
                "reason": <reason>
              }

  CloudWatchIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CloudWatchIncidentEventRule.Arn
  # ===========================================================================
  # PHASE 2 - AWS CONFIG DETECTION
  # Detects potentially unsafe AWS configurations.
  # ===========================================================================

  ConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    Properties:
      Name: !Sub "incident-config-recorder-${Environment}"
      RecordingGroup:
        AllSupported: true
        IncludeGlobalResourceTypes: true
      RoleARN: !GetAtt ConfigRole.Arn

  ConfigDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    Properties:
      Name: !Sub "incident-config-delivery-${Environment}"
      S3BucketName: !Ref IncidentDataLake

  ConfigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-config-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - config.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWS_ConfigRole

  PublicS3BucketConfigRule:
    Type: AWS::Config::ConfigRule
    DependsOn: [ConfigRecorder, ConfigDeliveryChannel]
    Properties:
      ConfigRuleName: !Sub "incident-public-s3-${Environment}"
      Description: Detects S3 buckets with public access
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED

  IAMPolicyConfigRule:
    Type: AWS::Config::ConfigRule
    DependsOn: [ConfigRecorder, ConfigDeliveryChannel]
    Properties:
      ConfigRuleName: !Sub "incident-iam-policy-${Environment}"
      Description: Detects IAM policies that may be overly permissive
      Source:
        Owner: AWS
        SourceIdentifier: IAM_POLICY_NO_STATEMENTS_WITH_ADMIN_ACCESS
  ConfigIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-config-detection-${Environment}"
      Description: Routes AWS Config non-compliance events to the collector
      EventPattern:
        source:
          - aws.config
        detail-type:
          - "Config Rules Compliance Change"
        detail:
          newEvaluationResult:
            complianceType:
              - NON_COMPLIANT
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: ConfigCollectorTarget
          InputTransformer:
            InputPathsMap:
              rule_name: "$.detail.configRuleName"
              resource_type: "$.detail.resourceType"
              resource_id: "$.detail.resourceId"
            InputTemplate: |
              {
                "source": "aws_config",
                "fault_class": "misconfiguration",
                "config_rule": <rule_name>,
                "resource_type": <resource_type>,
                "resource_id": <resource_id>
              }

  ConfigIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ConfigIncidentEventRule.Arn

  GuardDutyIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-guardduty-detection-${Environment}"
      Description: Routes relevant GuardDuty findings to the collector
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - "GuardDuty Finding"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: GuardDutyCollectorTarget

  GuardDutyIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GuardDutyIncidentEventRule.Arn

  ServiceCHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-service-c-latency-${Environment}"
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ServiceCFunction
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ServiceCascadeCompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub "incident-service-cascade-${Environment}"
      AlarmRule: !Sub "ALARM(\"incident-service-a-errors-${Environment}\") AND ALARM(\"incident-service-c-latency-${Environment}\")"
    DependsOn:
      - ServiceAErrorAlarm
      - ServiceCHighLatencyAlarm

  CascadeIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-cascade-detection-${Environment}"
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - "CloudWatch Alarm State Change"
        detail:
          state:
            value:
              - ALARM
          alarmName:
            - !Sub "incident-service-cascade-${Environment}"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: CascadeCollectorTarget
          InputTransformer:
            InputPathsMap:
              alarm_name: "$.detail.alarmName"
              state: "$.detail.state.value"
            InputTemplate: |
              {
                "source": "cloudwatch",
                "fault_class": "service_cascade",
                "alarm_name": <alarm_name>,
                "state": <state>
              }

  CascadeIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CascadeIncidentEventRule.Arn

  # ===========================================================================
  # PHASE 6 - REMEDIATION
  # Executes the approved action and triggers closed-loop verification.
  # ===========================================================================

  RemediationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/remediation/
      Handler: app.lambda_handler
      Role: !GetAtt RemediationRole.Arn
      Description: Executes the approved remediation action then async-invokes the verification Lambda
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          VERIFICATION_FUNCTION_NAME: !Ref VerificationFunction

  # ===========================================================================
  # PHASE 6.5 - CLOSED-LOOP VERIFICATION (core research novelty)
  # Waits 2 min post-remediation, re-checks the original detection signal,
  # writes resolved/not_resolved/inconclusive to IncidentRecord.verification.
  # ===========================================================================

  VerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/verification/
      Handler: app.lambda_handler
      Role: !GetAtt RemediationRole.Arn
      Description: Re-checks the original incident signal post-remediation and writes verification outcome to DynamoDB
      Timeout: 600
      MemorySize: 256
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake

  IncidentDataLakeConfigPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IncidentDataLake
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSConfigBucketPermissionsCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt IncidentDataLake.Arn
          - Sid: AWSConfigBucketDelivery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${IncidentDataLake.Arn}/AWSLogs/${AWS::AccountId}/Config/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
  # ===========================================================================
  # PHASE 5 - REPORTING + APPROVAL
  # Notify Lambda posts the diagnosis to Slack via incoming webhook;
  # Approval endpoint flips remediation.status and triggers remediation.
  # ===========================================================================

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/reporting/
      Handler: app.lambda_handler
      Role: !GetAtt ReportingApprovalRole.Arn
      Description: Formats the diagnosis into a Slack message and posts it via incoming webhook
      Timeout: 30
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          SLACK_WEBHOOK_URL_SSM: !Ref SlackWebhookUrlSsm
          APPROVAL_TOKEN_SECRET_SSM: !Ref ApprovalTokenSecretSsm
          APPROVAL_API_BASE: !Ref ApprovalApiBaseUrl

  ApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/approval/
      Handler: app.lambda_handler
      Role: !GetAtt ReportingApprovalRole.Arn
      Description: Approve/reject endpoint; updates incident status and invokes remediation when approved
      Timeout: 30
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          APPROVAL_TOKEN_SECRET_SSM: !Ref ApprovalTokenSecretSsm
          REMEDIATION_FUNCTION_NAME: !Ref RemediationFunction
      Events:
        ApprovalGet:
          Type: Api
          Properties:
            Path: /approval
            Method: get
        ApprovalPost:
          Type: Api
          Properties:
            Path: /approval
            Method: post

  # Shared role for the two Phase 5 Lambdas: read incidents + raw data,
  # decrypt the two SSM parameters, and invoke the remediation Lambda.
  ReportingApprovalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-reporting-approval-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: incident-record-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: raw-evidence-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
        - PolicyName: ssm-secure-parameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackWebhookUrlSsm}"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApprovalTokenSecretSsm}"
        - PolicyName: invoke-remediation-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*RemediationFunction*"

  ApprovalFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApprovalFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  # ===========================================================================
  # PHASE 8 - PRESENTATION DASHBOARD
  # Read-only API for the dashboard web interface.
  # ===========================================================================

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/dashboard/
      Handler: app.lambda_handler
      Role: !GetAtt DashboardRole.Arn
      Description: Phase 8 read-only dashboard API - GET /incidents, GET /incidents/{id}, GET /results
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          COLLECTOR_FUNCTION_NAME: !Ref CollectorFunction
          DIAGNOSIS_FUNCTION_NAME: !Ref DiagnosisFunction
      Events:
        # GET /incidents - list incidents with pagination and filtering
        GetIncidents:
          Type: Api
          Properties:
            Path: /incidents
            Method: get
        # GET /incidents/{incident_id} - get full incident detail with raw data
        GetIncidentDetail:
          Type: Api
          Properties:
            Path: /incidents/{incident_id}
            Method: get
        # GET /results - get evaluation results and metrics
        GetResults:
          Type: Api
          Properties:
            Path: /results
            Method: get
        # GET /health - health check
        GetHealth:
          Type: Api
          Properties:
            Path: /health
            Method: get
        # POST /inject - trigger fault injection
        PostInject:
          Type: Api
          Properties:
            Path: /inject
            Method: post
        # POST /diagnose - trigger manual diagnosis
        PostDiagnose:
          Type: Api
          Properties:
            Path: /diagnose
            Method: post
        # OPTIONS for CORS
        OptionsIncidents:
          Type: Api
          Properties:
            Path: /incidents
            Method: options
        OptionsIncidentDetail:
          Type: Api
          Properties:
            Path: /incidents/{incident_id}
            Method: options
        OptionsResults:
          Type: Api
          Properties:
            Path: /results
            Method: options
        OptionsInject:
          Type: Api
          Properties:
            Path: /inject
            Method: options
        OptionsDiagnose:
          Type: Api
          Properties:
            Path: /diagnose
            Method: options

  # Dashboard API Role
  DashboardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-dashboard-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: dashboard-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DynamoDB read-only access to incidents table
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt IncidentsTable.Arn
              # S3 read-only access to incident data and evaluation results
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: 
                  - !Sub "${IncidentDataLake.Arn}/incidents/*"
                  - !Sub "${IncidentDataLake.Arn}/evaluation/*"
              # Lambda invoke permissions for trigger endpoints
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt CollectorFunction.Arn
                  - !GetAtt DiagnosisFunction.Arn

# =============================================================================
# OUTPUTS
# =============================================================================

Outputs:

  IncidentDataLakeName:
    Description: Name of the S3 data lake bucket
    Value: !Ref IncidentDataLake

  IncidentsTableName:
    Description: Name of the DynamoDB incidents table
    Value: !Ref IncidentsTable

  CollectorDiagnosisRoleArn:
    Description: ARN of the collector/diagnosis IAM role
    Value: !GetAtt CollectorDiagnosisRole.Arn

  RemediationRoleArn:
    Description: ARN of the remediation Lambda role
    Value: !GetAtt RemediationRole.Arn

  DemoAppRoleArn:
    Description: ARN of the Phase 1 demo application role
    Value: !GetAtt DemoAppRole.Arn

  CollectorFunctionArn:
    Description: ARN of the Phase 3 collector Lambda
    Value: !GetAtt CollectorFunction.Arn

  DiagnosisFunctionArn:
    Description: ARN of the Phase 4 diagnosis Lambda (stub until Phase 4)
    Value: !GetAtt DiagnosisFunction.Arn

  NotifyFunctionArn:
    Description: ARN of the Phase 5 notify (Slack reporting) Lambda
    Value: !GetAtt NotifyFunction.Arn

  ApprovalFunctionArn:
    Description: ARN of the Phase 5 approval endpoint Lambda
    Value: !GetAtt ApprovalFunction.Arn

  RemediationFunctionArn:
    Description: ARN of the Phase 6 remediation Lambda
    Value: !GetAtt RemediationFunction.Arn

  VerificationFunctionArn:
    Description: ARN of the Phase 6.5 verification Lambda
    Value: !GetAtt VerificationFunction.Arn

  ApprovalUrl:
    Description: Phase 5 approval endpoint (append ?incident_id=...&action=approve&token=...)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/approval"

  ServiceAUrl:
    Description: Phase 1 entry point
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/start"

  ServiceBUrl:
    Description: Service B endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/service-b"

  ServiceCUrl:
    Description: Service C endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/service-c"

  DashboardFunctionArn:
    Description: ARN of the Phase 8 dashboard API Lambda
    Value: !GetAtt DashboardFunction.Arn

  DashboardApiUrl:
    Description: Phase 8 dashboard API base URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"