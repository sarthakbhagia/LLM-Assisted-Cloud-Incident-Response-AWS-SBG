AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LLM-Assisted Cloud Incident Response - serverless pipeline.
  Phase 0: infra skeleton (data lake, incident table, IAM roles).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Architectures: [arm64]
    Tracing: Active

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment, used to suffix resource names.

  ServiceBUrl:
    Type: String
    Default: "http://placeholder-service-b"
    Description: HTTP endpoint used by Service A to call Service B.

  ServiceCUrl:
    Type: String
    Default: "http://placeholder-service-c"
    Description: HTTP endpoint used by Service B to call Service C.

  SlackWebhookUrlSsm:
    Type: String
    Default: "/llm-incident-response/slack-webhook-url"
    Description: >
      Name of the SSM SecureString parameter holding the Slack incoming
      webhook URL (Phase 5). If the parameter does not exist, Slack posting
      is skipped and the pipeline continues (logged as an error).

  ApprovalTokenSecretSsm:
    Type: String
    Default: "/llm-incident-response/approval-token-secret"
    Description: >
      Name of the SSM SecureString parameter holding the shared HMAC secret
      used to sign approval links (Phase 5). If the parameter does not exist,
      no approval links are included in Slack messages and approval requests
      are rejected (fail closed).

  ApprovalApiBaseUrl:
    Type: String
    Default: ""
    Description: >
      Base URL of the approval endpoint used in Slack approval links, e.g.
      https://<api-id>.execute-api.<region>.amazonaws.com/Prod/approval.
      Leave empty to omit approval links from Slack messages.

  BedrockModelId:
    Type: String
    Default: "apac.amazon.nova-pro-v1:0"
    Description: >
      Bedrock model ID to use for diagnosis. Must be available in the deployment region.
      Examples: apac.amazon.nova-pro-v1:0 (ap-south-1), anthropic.claude-3-5-sonnet-20240620-v1:0, meta.llama3-70b-instruct-v1:0

Resources:

  # ===========================================================================
  # PIPELINE SELF-HEALING - DEAD LETTER QUEUES
  # Every async hop (EventBridge -> collector, diagnosis -> notify,
  # approval -> remediation, remediation -> verification, and the
  # scheduler-driven verification re-check) can silently drop work when the
  # target fails after retries. Each hop now lands failed events in this DLQ
  # and a queue-depth alarm fires the moment anything is stranded, so a
  # stalled pipeline is a visible alarm instead of a mystery.
  # ===========================================================================

  PipelineDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "incident-pipeline-dlq-${Environment}"
      MessageRetentionPeriod: 1209600  # 14 days - enough to triage and replay

  # EventBridge delivers DeadLetterConfig events as the events.amazonaws.com
  # service principal; SAM grants the queue policy for function-level DLQs
  # automatically, but rule-level DeadLetterConfig needs this explicit grant.
  PipelineDlqEventBridgePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref PipelineDlq]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PipelineDlq.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  DlqAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "incident-pipeline-alerts-${Environment}"

  DlqAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref DlqAlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref DlqAlarmTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  # Any message in the DLQ means an incident pipeline hop was lost. Fires on
  # the first message and resolves when the queue is drained.
  PipelineDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-pipeline-dlq-not-empty-${Environment}"
      AlarmDescription: A pipeline hop dropped an event - inspect the DLQ and replay the incident
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PipelineDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref DlqAlarmTopic]
      OKActions: [!Ref DlqAlarmTopic]

  # ---------------------------------------------------------------------------
  # Incident data lake (raw observability bundles + runbook docs)
  # ---------------------------------------------------------------------------
  IncidentDataLake:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "llm-incident-datalake-${AWS::AccountId}-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------------
  # Structured incident records
  # ---------------------------------------------------------------------------
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "incidents-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------------
  # IAM role: collector + diagnosis Lambdas.
  # Read-only observability access + Bedrock invoke + S3/DynamoDB write.
  # ---------------------------------------------------------------------------
  CollectorDiagnosisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-collector-diagnosis-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: observability-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:DescribeLogStreams
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'
              - Effect: Allow
                Action:
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                  - xray:GetServiceGraph
                  - xray:GetTraceGraph
                Resource: '*'
              - Effect: Allow
                Action:
                  - config:GetComplianceDetailsByConfigRule
                  - config:GetResourceConfigHistory
                  - config:DescribeComplianceByConfigRule
                Resource: '*'
              - Effect: Allow
                Action:
                  - guardduty:GetFindings
                  - guardduty:ListFindings
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:ListFunctions
                Resource: '*'
        - PolicyName: datalake-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/runbooks/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt IncidentDataLake.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
        - PolicyName: write-pipeline-dlq
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Async-invoke DLQ writes (collector/diagnosis function-level DLQs)
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDlq.Arn
        - PolicyName: invoke-downstream-lambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:llm-incident-response-${Environment}-DiagnosisFunction*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:llm-incident-response-${Environment}-NotifyFunction*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:llm-incident-response-${Environment}-RemediationFunction*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:llm-incident-response-${Environment}-ApprovalFunction*"


  # ---------------------------------------------------------------------------
  # IAM role: remediation Lambda.
  # Tightly scoped to ONLY the specific actions in actions.py. No wildcards.
  # ---------------------------------------------------------------------------
  RemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-remediation-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: remediation-read-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutPublicAccessBlock
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - config:GetComplianceDetailsByConfigRule
                Resource: '*'
        - PolicyName: remediation-lambda-actions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # scale_up - Lambda reserved concurrency
              - Effect: Allow
                Action:
                  - lambda:GetFunctionConcurrency
                  - lambda:PutFunctionConcurrency
                  - lambda:ListFunctions
                Resource: '*'
              # restart_service / restart_downstream_service - bump env var
              - Effect: Allow
                Action:
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionConfiguration
                  - lambda:ListFunctions
                Resource: '*'

        - PolicyName: remediation-iam-actions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # tighten_iam_policy
              - Effect: Allow
                Action:
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                Resource: '*'
        - PolicyName: invoke-verification-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:llm-incident-response-${Environment}-VerificationFunction*"
        - PolicyName: write-pipeline-dlq
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Async-invoke DLQ writes (remediation/verification function-level DLQs)
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDlq.Arn
        - PolicyName: schedule-verification-recheck
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Verification schedules a one-off EventBridge Scheduler re-check
              # instead of sleeping in the function (no billed wait time).
              - Effect: Allow
                Action: scheduler:CreateSchedule
                Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/verification-rechecks-${Environment}/verify-*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt VerificationSchedulerRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  # ===========================================================================
  # PHASE 1 - DEMO APPLICATION
  # Service A -> Service B -> Service C
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # IAM role for demo application
  # ---------------------------------------------------------------------------
  DemoAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-demo-app-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: xray-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  # ---------------------------------------------------------------------------
  # Service C
  # ---------------------------------------------------------------------------
  ServiceCFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/service_c/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /service-c
            Method: get

  # ---------------------------------------------------------------------------
  # Service B
  # ---------------------------------------------------------------------------
  ServiceBFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/service_b/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Environment:
        Variables:
          SERVICE_C_URL: !Ref ServiceCUrl
      Events:
        Api:
          Type: Api
          Properties:
            Path: /service-b
            Method: get

  # ---------------------------------------------------------------------------
  # Service A
  # ---------------------------------------------------------------------------
  ServiceAFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/service_a/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Environment:
        Variables:
          SERVICE_B_URL: !Ref ServiceBUrl
      Events:
        Api:
          Type: Api
          Properties:
            Path: /start
            Method: get
  # =========================================================================== 
  # PHASE 2 - DETECTION
  # Collector Lambda receives detection events from EventBridge.
  # Full evidence collection will be implemented in Phase 3.
  # ===========================================================================
    # ---------------------------------------------------------------------------
  # PHASE 2 - Resource Exhaustion Detection
  # Lambda execution taking too long can indicate resource pressure.
  # ---------------------------------------------------------------------------

  ServiceAResourceExhaustionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-service-a-resource-exhaustion-${Environment}"
      AlarmDescription: Detects unusually long Service A Lambda executions
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ServiceAFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 50000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

   # ---------------------------------------------------------------------------
  # PHASE 2 - Service Error Detection
  # Repeated Lambda errors are an incident detection signal.
  # ---------------------------------------------------------------------------

  ServiceAErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-service-a-errors-${Environment}"
      AlarmDescription: Detects repeated errors from Service A
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ServiceAFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/collector/
      Handler: collector_lambda.lambda_handler
      Role: !GetAtt CollectorDiagnosisRole.Arn
      Description: Receives incident detection events, collects observability evidence, writes to S3+DynamoDB, invokes diagnosis
      Timeout: 300
      MemorySize: 512
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt PipelineDlq.Arn
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          DIAGNOSIS_FUNCTION_NAME: !Ref DiagnosisFunction

  DiagnosisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/diagnosis/
      Handler: diagnosis_lambda.lambda_handler
      Role: !GetAtt CollectorDiagnosisRole.Arn
      Description: Receives incident evidence, loads runbook context, calls Bedrock for LLM diagnosis
      Timeout: 120
      MemorySize: 512
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt PipelineDlq.Arn
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          NOTIFY_FUNCTION_NAME: !Ref NotifyFunction

  # ---------------------------------------------------------------------------
  # PHASE 2 - EventBridge routing for CloudWatch alarms
  # ---------------------------------------------------------------------------
  CloudWatchIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-cloudwatch-detection-${Environment}"
      Description: Routes resource exhaustion alarm events to the collector
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - "CloudWatch Alarm State Change"
        detail:
          state:
            value:
              - ALARM
          alarmName:
            - !Sub "incident-service-a-resource-exhaustion-${Environment}"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: CollectorTarget
          DeadLetterConfig:
            Arn: !GetAtt PipelineDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600
          InputTransformer:
            InputPathsMap:
              alarm_name: "$.detail.alarmName"
              state: "$.detail.state.value"
              reason: "$.detail.state.reason"
            InputTemplate: |
              {
                "source": "cloudwatch",
                "fault_class": "resource_exhaustion",
                "alarm_name": <alarm_name>,
                "state": <state>,
                "reason": <reason>
              }

  CloudWatchIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CloudWatchIncidentEventRule.Arn
  # ===========================================================================
  # PHASE 2 - GUARDDUTY DETECTION (AWS Config disabled - only one recorder/channel per account)
  # ===========================================================================

  GuardDutyIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-guardduty-detection-${Environment}"
      Description: Routes relevant GuardDuty findings to the collector
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - "GuardDuty Finding"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: GuardDutyCollectorTarget
          DeadLetterConfig:
            Arn: !GetAtt PipelineDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600

  GuardDutyIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GuardDutyIncidentEventRule.Arn

  ServiceCHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "incident-service-c-latency-${Environment}"
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ServiceCFunction
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ServiceCascadeCompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub "incident-service-cascade-${Environment}"
      AlarmRule: !Sub "ALARM(\"incident-service-a-errors-${Environment}\") AND ALARM(\"incident-service-c-latency-${Environment}\")"
    DependsOn:
      - ServiceAErrorAlarm
      - ServiceCHighLatencyAlarm

  CascadeIncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "incident-cascade-detection-${Environment}"
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - "CloudWatch Alarm State Change"
        detail:
          state:
            value:
              - ALARM
          alarmName:
            - !Sub "incident-service-cascade-${Environment}"
      Targets:
        - Arn: !GetAtt CollectorFunction.Arn
          Id: CascadeCollectorTarget
          DeadLetterConfig:
            Arn: !GetAtt PipelineDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600
          InputTransformer:
            InputPathsMap:
              alarm_name: "$.detail.alarmName"
              state: "$.detail.state.value"
            InputTemplate: |
              {
                "source": "cloudwatch",
                "fault_class": "service_cascade",
                "alarm_name": <alarm_name>,
                "state": <state>
              }

  CascadeIncidentEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CascadeIncidentEventRule.Arn

  # ===========================================================================
  # PHASE 6 - REMEDIATION
  # Executes the approved action and triggers closed-loop verification.
  # ===========================================================================

  RemediationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/remediation/
      Handler: remediation_lambda.lambda_handler
      Role: !GetAtt RemediationRole.Arn
      Description: Executes the approved remediation action then async-invokes the verification Lambda
      Timeout: 300
      MemorySize: 256
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt PipelineDlq.Arn
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          VERIFICATION_FUNCTION_NAME: !Ref VerificationFunction

  # ===========================================================================
  # PHASE 6.5 - CLOSED-LOOP VERIFICATION (core research novelty)
  # Waits 2 min post-remediation, re-checks the original detection signal,
  # writes resolved/not_resolved/inconclusive to IncidentRecord.verification.
  # ===========================================================================

  VerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/verification/
      Handler: verification_lambda.lambda_handler
      Role: !GetAtt RemediationRole.Arn
      Description: Schedules a one-off re-check of the original incident signal and writes the verification outcome to DynamoDB
      Timeout: 120
      MemorySize: 256
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt PipelineDlq.Arn
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          VERIFICATION_WAIT_SECONDS: "120"
          SCHEDULER_ROLE_ARN: !GetAtt VerificationSchedulerRole.Arn
          SCHEDULER_GROUP_NAME: !Sub "verification-rechecks-${Environment}"
          VERIFICATION_FUNCTION_ARN: !GetAtt VerificationFunction.Arn
          PIPELINE_DLQ_ARN: !GetAtt PipelineDlq.Arn

  # Role assumed BY EventBridge Scheduler to invoke the verification Lambda
  # for the one-off re-check. Deliberately separate from RemediationRole.
  VerificationSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-verification-scheduler-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-verification-recheck
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt VerificationFunction.Arn
              # Scheduler delivers failed re-check deliveries to the shared
              # pipeline DLQ using this role's credentials.
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDlq.Arn

  # EventBridge Scheduler needs a group for the one-off schedules; the
  # verification Lambda creates each schedule under this group with
  # ActionAfterComplete=DELETE so they clean themselves up.
  VerificationScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "verification-rechecks-${Environment}"

  # ===========================================================================
  # PIPELINE SELF-HEALING - APPROVED-STATE SWEEPER
  # The approval -> remediation hop is async: if the invoke fails or the
  # remediation Lambda dies before writing its terminal status, the incident
  # is stranded at remediation.status=approved forever (observed in staging).
  # The sweeper re-invokes remediation for such records; remediation's own
  # status checks + conditional writes make the retry idempotent.
  # ===========================================================================

  SweeperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-sweeper-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: sweeper-scan-reinvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RemediationFunction.Arn

  SweeperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/sweeper/
      Handler: sweeper_lambda.lambda_handler
      Role: !GetAtt SweeperRole.Arn
      Description: Re-invokes remediation for incidents stuck in remediation.status=approved beyond STUCK_AFTER_SECONDS
      Timeout: 120
      MemorySize: 128
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          REMEDIATION_FUNCTION_NAME: !Ref RemediationFunction
          STUCK_AFTER_SECONDS: "600"
          MAX_SWEEP_PER_RUN: "10"
          MAX_AGE_HOURS: "48"
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Sweep stranded approved incidents
            Enabled: true

  IncidentDataLakeConfigPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref IncidentDataLake
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSConfigBucketPermissionsCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt IncidentDataLake.Arn
          - Sid: AWSConfigBucketDelivery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${IncidentDataLake.Arn}/AWSLogs/${AWS::AccountId}/Config/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
  # ===========================================================================
  # PHASE 5 - REPORTING + APPROVAL
  # Notify Lambda posts the diagnosis to Slack via incoming webhook;
  # Approval endpoint flips remediation.status and triggers remediation.
  # ===========================================================================

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/reporting/
      Handler: notify_lambda.lambda_handler
      Role: !GetAtt ReportingApprovalRole.Arn
      Description: Formats the diagnosis into a Slack message and posts it via incoming webhook
      Timeout: 30
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt PipelineDlq.Arn
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
          SLACK_WEBHOOK_URL_SSM: !Ref SlackWebhookUrlSsm
          APPROVAL_TOKEN_SECRET_SSM: !Ref ApprovalTokenSecretSsm
          APPROVAL_API_BASE: !Ref ApprovalApiBaseUrl

  ApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/approval/
      Handler: approval_handler.lambda_handler
      Role: !GetAtt ReportingApprovalRole.Arn
      Description: Approve/reject endpoint; updates incident status and invokes remediation when approved
      Timeout: 30
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt PipelineDlq.Arn
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          APPROVAL_TOKEN_SECRET_SSM: !Ref ApprovalTokenSecretSsm
          REMEDIATION_FUNCTION_NAME: !Ref RemediationFunction
      Events:
        ApprovalGet:
          Type: Api
          Properties:
            Path: /approval
            Method: get
        ApprovalPost:
          Type: Api
          Properties:
            Path: /approval
            Method: post

  # Shared role for the two Phase 5 Lambdas: read incidents + raw data,
  # decrypt the two SSM parameters, and invoke the remediation Lambda.
  ReportingApprovalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-reporting-approval-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: write-pipeline-dlq
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Async-invoke DLQ writes (notify/approval function-level DLQs)
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PipelineDlq.Arn
        - PolicyName: incident-record-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: raw-evidence-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
        - PolicyName: ssm-secure-parameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackWebhookUrlSsm}"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApprovalTokenSecretSsm}"
        - PolicyName: invoke-remediation-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*RemediationFunction*"

  ApprovalFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApprovalFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  # ===========================================================================
  # PHASE 8 - DASHBOARD API (read-only visualization layer)
  # Guardrail: this role MUST NOT have any write permissions.
  # See PROJECT_SPEC.md Guardrails: "The Phase 8 dashboard Lambda/IAM role must
  # be strictly read-only (DynamoDB GetItem/Query and S3 GetObject only)."
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # IAM role: Dashboard API Lambda.
  # Read-only on incidents table and data lake. No write actions of any kind.
  # ---------------------------------------------------------------------------
  DashboardApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-dashboard-api-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: incidents-table-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: "arn:aws:dynamodb:*:*:table/incidents-*"
                # Deny any write action explicitly to make the guardrail auditable
              - Effect: Deny
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource: "*"
        - PolicyName: datalake-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt IncidentDataLake.Arn
                  - !Sub "${IncidentDataLake.Arn}/incidents/*"
                  - !Sub "${IncidentDataLake.Arn}/runbooks/*"
                  - !Sub "${IncidentDataLake.Arn}/evaluation/*"
              - Effect: Deny
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:PutObjectAcl
                Resource: "*"

  # ---------------------------------------------------------------------------
  # Dashboard API Lambda — six read-only routes on the existing API Gateway
  # ---------------------------------------------------------------------------
  DashboardApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dashboard_api/
      Handler: dashboard_api_lambda.lambda_handler
      Role: !GetAtt DashboardApiRole.Arn
      Description: >-
        Phase 8 read-only dashboard API. Serves incident records, evidence
        bundles, Phase 7 analytics, and runbook content. No write paths.
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          DATA_LAKE_BUCKET: !Ref IncidentDataLake
      Events:
        GetIncidents:
          Type: Api
          Properties:
            Path: /api/incidents
            Method: get
        GetIncidentsOptions:
          Type: Api
          Properties:
            Path: /api/incidents
            Method: options
        GetIncidentById:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}
            Method: get
        GetIncidentByIdOptions:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}
            Method: options
        GetEvidence:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/evidence
            Method: get
        GetEvidenceOptions:
          Type: Api
          Properties:
            Path: /api/incidents/{incident_id}/evidence
            Method: options
        GetAnalytics:
          Type: Api
          Properties:
            Path: /api/analytics
            Method: get
        GetAnalyticsOptions:
          Type: Api
          Properties:
            Path: /api/analytics
            Method: options
        GetRunbooks:
          Type: Api
          Properties:
            Path: /api/runbooks
            Method: get
        GetRunbooksOptions:
          Type: Api
          Properties:
            Path: /api/runbooks
            Method: options
        GetRunbookByFaultClass:
          Type: Api
          Properties:
            Path: /api/runbooks/{fault_class}
            Method: get
        GetRunbookByFaultClassOptions:
          Type: Api
          Properties:
            Path: /api/runbooks/{fault_class}
            Method: options

# DashboardApiFunctionApiPermission:
#     Type: AWS::Lambda::Permission
#     Properties:
#       FunctionName: !Ref DashboardApiFunction
#       Action: lambda:InvokeFunction
#       Principal: apigateway.amazonaws.com

  DashboardApiFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DashboardApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com


# =============================================================================

Outputs:

  IncidentDataLakeName:
    Description: Name of the S3 data lake bucket
    Value: !Ref IncidentDataLake
    Export:
      Name: !Sub "${AWS::StackName}-IncidentDataLakeName"

  IncidentsTableName:
    Description: Name of the DynamoDB incidents table
    Value: !Ref IncidentsTable
    Export:
      Name: !Sub "${AWS::StackName}-IncidentsTableName"

  IncidentsTableArn:
    Description: ARN of the DynamoDB incidents table
    Value: !GetAtt IncidentsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-IncidentsTableArn"

  ApprovalFunctionArn:
    Description: ARN of the Phase 5 approval endpoint Lambda
    Value: !GetAtt ApprovalFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ApprovalFunctionArn"

  RemediationRoleArn:
    Description: ARN of the remediation Lambda role
    Value: !GetAtt RemediationRole.Arn

  DemoAppRoleArn:
    Description: ARN of the Phase 1 demo application role
    Value: !GetAtt DemoAppRole.Arn

  CollectorFunctionArn:
    Description: ARN of the Phase 3 collector Lambda
    Value: !GetAtt CollectorFunction.Arn

  DiagnosisFunctionArn:
    Description: ARN of the Phase 4 diagnosis Lambda (stub until Phase 4)
    Value: !GetAtt DiagnosisFunction.Arn

  NotifyFunctionArn:
    Description: ARN of the Phase 5 notify (Slack reporting) Lambda
    Value: !GetAtt NotifyFunction.Arn

  RemediationFunctionArn:
    Description: ARN of the Phase 6 remediation Lambda
    Value: !GetAtt RemediationFunction.Arn

  SweeperFunctionArn:
    Description: ARN of the approved-state sweeper Lambda
    Value: !GetAtt SweeperFunction.Arn

  VerificationFunctionArn:
    Description: ARN of the Phase 6.5 verification Lambda
    Value: !GetAtt VerificationFunction.Arn

  ApprovalUrl:
    Description: Phase 5 approval endpoint (append ?incident_id=...&action=approve&token=...)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/approval"

  ServiceAUrl:
    Description: Phase 1 entry point
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/start"

  ServiceBUrl:
    Description: Service B endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/service-b"

  ServiceCUrl:
    Description: Service C endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/service-c"

  DashboardApiFunctionArn:
    Description: ARN of the Phase 8 read-only dashboard API Lambda
    Value: !GetAtt DashboardApiFunction.Arn

  DashboardApiUrl:
    Description: >-
      Phase 8 dashboard API base URL. Append /api/incidents, /api/analytics,
      /api/runbooks etc. to call the read-only dashboard endpoints.
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api"

  DashboardApiRoleArn:
    Description: ARN of the Phase 8 read-only dashboard IAM role (no write permissions)
    Value: !GetAtt DashboardApiRole.Arn
