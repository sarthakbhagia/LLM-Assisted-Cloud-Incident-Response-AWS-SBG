AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LLM-Assisted Cloud Incident Response - serverless pipeline.
  Phase 0: infra skeleton (data lake, incident table, IAM roles).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Architectures: [arm64]

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment, used to suffix resource names.

  ServiceBUrl:
    Type: String
    Default: "http://placeholder-service-b"
    Description: HTTP endpoint used by Service A to call Service B.

  ServiceCUrl:
    Type: String
    Default: "http://placeholder-service-c"
    Description: HTTP endpoint used by Service B to call Service C.

Resources:

  # ---------------------------------------------------------------------------
  # Incident data lake (raw observability bundles + runbook docs)
  # ---------------------------------------------------------------------------
  IncidentDataLake:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "llm-incident-datalake-${AWS::AccountId}-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------------
  # Structured incident records
  # ---------------------------------------------------------------------------
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "incidents-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------------
  # IAM role: collector + diagnosis Lambdas.
  # Read-only observability access + Bedrock invoke + S3/DynamoDB write.
  # ---------------------------------------------------------------------------
  CollectorDiagnosisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-collector-diagnosis-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: observability-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:DescribeLogStreams
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: '*'
              - Effect: Allow
                Action:
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                  - xray:GetServiceGraph
                  - xray:GetTraceGraph
                Resource: '*'
              - Effect: Allow
                Action:
                  - config:GetComplianceDetailsByConfigRule
                  - config:GetResourceConfigHistory
                  - config:DescribeComplianceByConfigRule
                Resource: '*'
              - Effect: Allow
                Action:
                  - guardduty:GetFindings
                  - guardduty:ListFindings
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTasks
                  - ecs:ListServices
                  - ecs:ListTasks
                Resource: '*'
        - PolicyName: datalake-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/runbooks/*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt IncidentsTable.Arn
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Retrieve
                  - bedrock:RetrieveAndGenerate
                Resource: '*'

  # ---------------------------------------------------------------------------
  # IAM role: remediation Lambda.
  # Tightly scoped to ONLY the specific actions in actions.py. No wildcards.
  # ---------------------------------------------------------------------------
  RemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-remediation-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: remediation-read-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${IncidentDataLake.Arn}/incidents/*"
        - PolicyName: remediation-actions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # scale_up - Application Auto Scaling + ECS update service
              - Effect: Allow
                Action:
                  - application-autoscaling:RegisterScalableTarget
                  - application-autoscaling:PutScalingPolicy
                  - application-autoscaling:DeregisterScalableTarget
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: '*'

              # restart_service / restart_downstream_service
              - Effect: Allow
                Action:
                  - ecs:StopTask
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                Resource: '*'

              # lock_s3_bucket
              - Effect: Allow
                Action:
                  - s3:PutPublicAccessBlock
                Resource: '*'

              # tighten_iam_policy
              - Effect: Allow
                Action:
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                Resource: '*'

  # ===========================================================================
  # PHASE 1 - DEMO APPLICATION
  # Service A -> Service B -> Service C
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # IAM role for demo application
  # ---------------------------------------------------------------------------
  DemoAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "incident-demo-app-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ---------------------------------------------------------------------------
  # Service C
  # ---------------------------------------------------------------------------
  ServiceCFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/service_c/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /service-c
            Method: get

  # ---------------------------------------------------------------------------
  # Service B
  # ---------------------------------------------------------------------------
  ServiceBFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/service_b/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Environment:
        Variables:
          SERVICE_C_URL: !Ref ServiceCUrl
      Events:
        Api:
          Type: Api
          Properties:
            Path: /service-b
            Method: get

  # ---------------------------------------------------------------------------
  # Service A
  # ---------------------------------------------------------------------------
  ServiceAFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/service_a/
      Handler: app.lambda_handler
      Role: !GetAtt DemoAppRole.Arn
      Environment:
        Variables:
          SERVICE_B_URL: !Ref ServiceBUrl
      Events:
        Api:
          Type: Api
          Properties:
            Path: /start
            Method: get

# =============================================================================
# OUTPUTS
# =============================================================================

Outputs:

  IncidentDataLakeName:
    Description: Name of the S3 data lake bucket
    Value: !Ref IncidentDataLake

  IncidentsTableName:
    Description: Name of the DynamoDB incidents table
    Value: !Ref IncidentsTable

  CollectorDiagnosisRoleArn:
    Description: ARN of the collector/diagnosis IAM role
    Value: !GetAtt CollectorDiagnosisRole.Arn

  RemediationRoleArn:
    Description: ARN of the remediation Lambda role
    Value: !GetAtt RemediationRole.Arn

  DemoAppRoleArn:
    Description: ARN of the Phase 1 demo application role
    Value: !GetAtt DemoAppRole.Arn

  ServiceAUrl:
    Description: Phase 1 entry point
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/start"

  ServiceBUrl:
    Description: Service B endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/service-b"

  ServiceCUrl:
    Description: Service C endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/service-c"